<!DOCTYPE html>
<html>

<head>

    <!-- meta tags and title -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronomy Calendar</title>

    <!-- external and internal CSS -->
    <link rel="stylesheet" href="styles.css" media="all">
    <link rel="stylesheet" href="nightly_view.css" media="all">
    <style>
        /* in-file CSS here */
    </style>

    <!-- external and internal JavaScript -->
    <script>
        // in-page JavaScript here
    </script>

</head>

<body>

    <nav>
        <form id="citySearch">
            <input type="text" name="searchbar" placeholder="Find astronomy information for a location">
            <button type=submit>&#128269;</button>
        </form>

        <h1 id="location">
            [Location here]
        </h1>
    </nav>

    <header>
        <h1> Friday Night </h1>
        <div class="timespan">
            <span class="sunrise"> 7:58PM </span> &#8208; <span class="sunset"> 6:18AM </span>
        </div>
    </header>

    <main>
        <section class="night-info"> 
            <span class="tempreture">
                Temp: <span class="high">42</span>&#176;F &#8208; <span class="low">23</span>&#176;F
            </span>
            <span class="precipitation">
                Chance Precipitation: <span class="chance">33</span>&#37;
            </span>
        </section>


        <section class="objects">
            <h2> Objects of Interest </h2>
            <nav> <!-- Searchbar and filtering (filtering can be implemented later.  Currently working on MVP)-->
                <form class="planetSearch">
                    <input type="text" name="searchbar" placeholder="Find visible objects">
                    <button type=submit>&#128269;</button>
                </form>
            </nav>
    
            <ul>
                <div class="section">
                    <div class="object" >
                        <div class="label">
                            [Secret 9th planet]
                        </div>
                        <div class="times">
                            <span class="rise">6:45PM</span> &#8208; <span class="set">12:01PM</span>
                        </div>
                    </div>
            </ul>
        </section>
    </main>
</body>

</html>
